name: CI/CD

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  release:
    types: [published]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ---------------------------------------------------------
  # Lint & Type Check
  # ---------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black ruff mypy

      - name: Run Black (format check)
        run: black --check --diff cat_tool/ tests/ mcat.py

      - name: Run Ruff (lint)
        run: ruff check cat_tool/ tests/ mcat.py

      - name: Run MyPy (type check)
        run: mypy cat_tool/ --ignore-missing-imports --no-strict-optional

  # ---------------------------------------------------------
  # Unit Tests
  # ---------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsqlite3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-qt

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=cat_tool --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------
  # Integration Tests (Windows-specific)
  # ---------------------------------------------------------
  test-windows:
    name: Windows Integration Tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-qt

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -k "not pdf"  # Skip PDF tests that may need display

  # ---------------------------------------------------------
  # Build Windows Executable
  # ---------------------------------------------------------
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest
    needs: [lint, test, test-windows]
    if: github.event_name == 'push' || github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller mcat.spec --clean --noconfirm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcat-windows
          path: dist/mcat/
          retention-days: 7

  # ---------------------------------------------------------
  # Build Windows Installer
  # ---------------------------------------------------------
  build-installer:
    name: Build Windows Installer
    runs-on: windows-latest
    needs: [build-windows]
    if: github.event_name == 'release'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download executable artifact
        uses: actions/download-artifact@v4
        with:
          name: mcat-windows
          path: dist/mcat/

      - name: Install Inno Setup
        run: |
          choco install innosetup --version=6.2.2

      - name: Build installer
        run: |
          iscc setup.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: mcat-installer
          path: Output/
          retention-days: 30

  # ---------------------------------------------------------
  # Create Release
  # ---------------------------------------------------------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-installer]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: mcat-installer
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------
  # Dependency Security Scan
  # ---------------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install safety bandit

      - name: Run Safety (dependency vulnerabilities)
        run: safety check --json --output safety-report.json || true

      - name: Run Bandit (code security)
        run: bandit -r cat_tool/ -f json -o bandit-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            safety-report.json
            bandit-report.json
          retention-days: 30